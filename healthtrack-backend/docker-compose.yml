version: "3.7"

services:
  app:
    build: .
    container_name: springboot-app
    ports:
      - "8081:8081"
    networks:
      - s-network
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/HealthTrackManagementDB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root

  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: HealthTrackManagementDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    networks:
      - s-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  s-network:
    driver: bridge

volumes:
  postgres-data:
